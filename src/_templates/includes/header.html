<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    {% if title and client %}<title>{{ client }}: {{ title }} | Tifa Jade, Producer &amp; Project Manager</title>{% else %}<title>{% if title %}{{ title }}{% else %}{{ client }}{% endif %}</title>{% endif %}

    <meta
      name="description"
      content="{% if subtitle %}{{ subtitle }}{% else %}{{ site.description }}{% endif %}"
    />
    <meta property="og:title" content="{% if title and client %}{{ client }}: {{ title }}{% else %}{% if title %}{{ title }}{% else %}{{ client }}{% endif %}{% endif %}" />
    <meta
      property="og:description"
      content="{% if subtitle %}{{ subtitle }}{% else %}{{ site.description }}{% endif %}"
    />
    <meta property="og:url" content="{{ site.url }}{{ page.url | url }}" />
    <meta property="og:type" content="website" />
    {% include "includes/head-meta.html" %}

    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tifa Jade" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#f8faf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1512" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="/assets/css/pico.jade.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/pm.css" />

    <script>
      // Use the saved choice, otherwise follow the visitor's system preference
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="ea3f477a-b6a7-4c4a-9b2e-25379e9fb80a"
    ></script>
  </head>

    <div class="pm-bg" aria-hidden="true"><span class="pm-bg__blob pm-bg__blob--a"><i></i></span><span class="pm-bg__blob pm-bg__blob--b"><i></i></span><span class="pm-bg__blob pm-bg__blob--c"><i></i></span></div>
